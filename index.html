<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--ink:#10233A;--muted:#5B6B7C;--line:#D5DCE3;
  --brand:#0F6B5C;--brand-ink:#FFFFFF;--brand-soft:#DCEFE9;
  --warn:#8A5200;--warn-soft:#FBEBCF;--bad:#B3261E;--bad-soft:#FBE3E1;--slip:#FFFEF8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620;--surface:#16212D;--ink:#E6EDF4;--muted:#93A3B3;--line:#2A3947;
    --brand:#3FBF9F;--brand-ink:#06251E;--brand-soft:#123A33;
    --warn:#F0B75A;--warn-soft:#3A2D12;--bad:#FF8A80;--bad-soft:#3E1B18;--slip:#1C2835;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1620;--surface:#16212D;--ink:#E6EDF4;--muted:#93A3B3;--line:#2A3947;
  --brand:#3FBF9F;--brand-ink:#06251E;--brand-soft:#123A33;
  --warn:#F0B75A;--warn-soft:#3A2D12;--bad:#FF8A80;--bad-soft:#3E1B18;--slip:#1C2835;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Tajawal','Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;
  font-size:16px;line-height:1.6}
.app{max-width:560px;margin:0 auto;padding:10px 14px 96px}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:8px 2px 12px}
h1{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:23px;margin:0;font-weight:700}
h2{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:18px;margin:0 0 8px;font-weight:700}
.today{color:var(--muted);font-size:13px}
.hdr{display:flex;flex-direction:column;align-items:flex-end;line-height:1.4}
.muted,.hint{color:var(--muted)}
.hint{font-size:13.5px;margin:0 0 10px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;color:var(--muted);
  font-family:inherit;font-size:13px;font-weight:600;padding:11px 2px 10px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-top-color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
input[type="checkbox"]{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-family:inherit;font-size:15px;font-weight:600;border:1px solid var(--brand);border-radius:8px;padding:11px 16px;
  background:var(--brand);color:var(--brand-ink);width:100%;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.small{width:auto;padding:5px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.flag{font-size:13px;padding:6px 9px;border-radius:6px;margin-bottom:6px}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.err{background:var(--bad-soft);color:var(--bad)}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dhead label{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.draft.skipped{opacity:.5}
.slip{background:var(--slip);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;margin-top:6px}
.slip .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:2px 0}
.slip .row b{font-weight:500;color:var(--ink)}
.slip .net{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);margin-top:6px;padding-top:8px}
.slip .net strong{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:30px;line-height:1.2;color:var(--brand)}
.slip .net strong.neg{color:var(--bad)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:20px;font-weight:700}
.stat b.neg{color:var(--bad)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.filters.one{grid-template-columns:1fr}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.order .otop{display:flex;justify-content:space-between;align-items:baseline}
.order .otop b{font-size:16px}
.order .obot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.order .onet{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:20px;color:var(--brand)}
.order .onet.neg{color:var(--bad)}
.small-text{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:26px 12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:12px}
.plist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.plist:last-child{border-bottom:0}
.pnum{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:1px 9px;margin-inline-end:8px}
.srow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.sect{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:17px;margin:18px 2px 8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:10px 0}
.kv>div{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px dashed var(--line);padding:3px 0}
.kv>div span{color:var(--muted)}
.rep-head{display:flex;justify-content:space-between;align-items:baseline}
.rep-head b{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:18px}
.rep-share{background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-weight:700}
.rep-share .num{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:20px}
.gate{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.gate-card h1{margin-bottom:6px}
.linkbtn{background:none;border:0;color:var(--brand);font-family:inherit;font-size:14px;padding:10px 0 0;cursor:pointer;width:100%;text-align:center}
:root{--hero-a:#0F6B5C;--hero-b:#0A4A5A;--ok-soft:#DDF3E8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero-a:#12705F;--hero-b:#0A3B4B;--ok-soft:#123A2C}}
:root[data-theme="dark"]{--hero-a:#12705F;--hero-b:#0A3B4B;--ok-soft:#123A2C}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
main>section:not([hidden]){animation:rise .28s ease both}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{line-height:1.15}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;color:#fff;flex:none}
.mark svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header.top{align-items:center}
.hdr{flex-direction:row;align-items:center;gap:8px}
.hdr .today{font-size:12px}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:8px 0 7px}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.98)}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px 18px 14px;color:#fff;background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);margin-bottom:12px}
.hero::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;inset-inline-end:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:14px;opacity:.9}
.hero .big{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:46px;font-weight:800;line-height:1.15;margin:2px 0 6px}
.hero .delta{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px dashed rgba(255,255,255,.4);padding-top:10px}
.hero .row3 small{display:block;opacity:.8;font-size:12px}
.hero .row3 b{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:17px}
.toprow{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;flex:none}
.avatar.sm{width:28px;height:28px;font-size:13px}
.kvline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.kvline:last-child{border-bottom:0}
.kvline>span{color:var(--muted)}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{border-radius:999px;padding:3px 12px;font-size:13px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.badge{font-size:12px;border-radius:999px;padding:1px 10px;font-weight:700;margin-inline-start:8px}
.badge.ok{background:var(--ok-soft);color:var(--brand)}
.badge.review{background:var(--warn-soft);color:var(--warn)}
.draft.ready{border-inline-start:4px solid var(--brand)}
.draft.review{border-inline-start:4px solid var(--warn)}
.savebar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:10px 0 4px;background:linear-gradient(to top,var(--bg) 65%,transparent);z-index:5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:slideUp .28s ease both}
.lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lock-card{width:100%;max-width:340px;text-align:center}
.lock-ic{width:96px;height:96px;margin:0 auto 16px;border-radius:28px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));box-shadow:0 12px 32px rgba(15,107,92,.35);animation:pop .5s both}
.lock-ic svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.burst{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.28);animation:fade .2s both}
.burst-in{display:flex;flex-direction:column;align-items:center;gap:14px}
.burst .ring{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;animation:pop .45s both;box-shadow:0 14px 44px rgba(0,0,0,.3)}
.burst svg{width:62px;height:62px;stroke:var(--brand);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .2s forwards}
.burst p{margin:0;color:#fff;font-weight:700;font-size:18px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.burst svg{stroke-dashoffset:0}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="lock" class="lock" hidden>
  <div class="lock-card">
    <div class="lock-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><path d="M9 10v1.5M15 10v1.5M12 10v4h-1"/><path d="M9 16.2c1.7 1.1 4.3 1.1 6 0"/></svg></div>

</div>

function canon(v){
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+canon(v[k])}).join(',')+'}';
  return JSON.stringify(v)+'';
}
function clone(x){return JSON.parse(JSON.stringify(x))}
function allOrders(){
  var out=[];
  Object.keys(state.days).forEach(function(k){(state.days[k]||[]).forEach(function(o){out.push(o)})});
  return out;
}
function saveLocal(){}
var pend={},busyKeys={};
function isBusy(){return Object.keys(pend).length>0||Object.keys(busyKeys).length>0}
function writeFailed(e){toast(e&&e.code==='quota_exceeded'?'امتلأت مساحة التخزين':'تعذر الحفظ على الخادم. حاول مرة أخرى.')}
function queue(key,fn){
  pend[key]=fn;
  if(busyKeys[key])return;
  busyKeys[key]=true;
  (function next(){
    var f=pend[key];
    if(!f){delete busyKeys[key];return}
    delete pend[key];
    Promise.resolve().then(f).catch(writeFailed).then(next);
  })();
}
function configBody(){
  var st=state.settings;
  return {products:state.products,settings:{purchase:st.purchase,companies:st.companies,defaultCompany:st.defaultCompany,gift:st.gift,minPrice:st.minPrice,
    single:st.single.map(function(r){return{price:r[0],share:r[1]}}),multi:st.multi}};
}
function saveConfig(){
  if(db)queue('config',function(){return db.doc('app/config').set(clone(configBody()))});
  else saveLocal();
}
function saveDay(date){
  if(db)queue('day:'+date,function(){
    var arr=state.days[date];
    if(arr&&arr.length)return db.doc('days/'+date).set(clone({date:date,orders:arr}));
    return db.doc('days/'+date).delete();
  });
  else saveLocal();
}
function saveAll(extra){
  if(!db){saveLocal();return}
  saveConfig();
  var seen={};
  (extra||[]).concat(Object.keys(state.days)).forEach(function(k){if(!seen[k]){seen[k]=1;saveDay(k)}});
}

/* ---------- helpers ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function digits(s){
  return String(s==null?'':s).replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-1632})
    .replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-1776});
}
function norm(s){
  return digits(s).replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[\u0623\u0625\u0622\u0671]/g,'\u0627').replace(/\u0649/g,'\u064A').replace(/\u0629/g,'\u0647')
    .toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
}
function fmt(n){return(n==null||isNaN(n))?'\u2014':Math.round(n).toLocaleString('en-US')}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function fmtDate(s){return s.slice(8,10)+'/'+s.slice(5,7)}
function toPrice(s){
  s=String(s).replace(/[\u066C,]/g,'');
  if(/^\d{1,3}\.\d{3}$/.test(s))s=s.replace('.','');
  var n=parseFloat(s);
  if(isNaN(n))return null;
  if(n>0&&n<1000)n*=1000;
  return Math.round(n);
}
function h(tag,props){
  var e=document.createElement(tag),kids=Array.prototype.slice.call(arguments,2),pv=null,hasV=false;
  if(props){Object.keys(props).forEach(function(k){
    var v=props[k];
    if(k==='class')e.className=v;
    else if(k==='value'){pv=v;hasV=true}
    else if(k==='checked')e.checked=!!v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  })}
  (function add(list){list.forEach(function(c){
    if(c==null||c===false)return;
    if(Array.isArray(c))return add(c);
    e.appendChild(c.nodeType?c:document.createTextNode(String(c)));
  })})(kids);
  if(hasV)e.value=pv;
  return e;
}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function avatar(name,size){
  var t=String(name||'?').trim(),ch=t.charAt(0)||'?',hue=0;
  for(var i=0;i<t.length;i++)hue=(hue*31+t.charCodeAt(i))%360;
  var a=h('span',{class:'avatar'+(size?' '+size:'')},ch);
  a.style.background='hsl('+hue+',52%,40%)';
  return a;
}
function animateNumber(el,to){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(typeof requestAnimationFrame!=='function'||reduce){el.textContent=fmt(to);return}
  var t0=null,dur=800;
  function step(ts){
    if(t0==null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=fmt(to*e);
    if(p<1)requestAnimationFrame(step);else el.textContent=fmt(to);
  }
  requestAnimationFrame(step);
}

function armButton(btn,label,action){

/* ---------- calculations ---------- */
function shareFor(price,qty){
  var s=state.settings;
  if(price==null)return{share:null,warn:''};
  if(price<s.minPrice)return{share:null,warn:'السعر أقل من الحد الأدنى ('+fmt(s.minPrice)+').',kind:'min'};
  if(qty<=1){
    var row=null;
    s.single.forEach(function(r){if(r[0]===price)row=r});
    if(row)return{share:row[1]};
    var top=s.single.reduce(function(a,r){return(!a||r[0]>a[0])?r:a},null);
    if(top&&price>top[0]&&(price-top[0])%5000===0)
      return{share:top[1]+(price-top[0])/5000*500};
    return{share:null,warn:'هذا السعر غير موجود في جدول الحصص. اكتب الحصة بيدك.'};
  }
  var m=s.multi;
  if(m.step>0&&(price-m.basePrice)%m.step===0){
    var sh=m.baseShare+(price-m.basePrice)/m.step*m.inc;
    if(sh>=0)return{share:sh};
  }
  return{share:null,warn:'هذا السعر غير موجود في حصص الطلبات المتعددة. اكتب الحصة بيدك.'};
}
function companyById(id){
  var cs=state.settings.companies,f=cs.filter(function(c){return c.id===id})[0];
  return f||cs[0];
}
function calc(price,qty,share,fee){
  var s=state.settings,purchase=s.purchase*qty,gift=s.gift*qty,delivery=fee==null?0:fee;
  return{purchase:purchase,delivery:delivery,gift:gift,net:price-purchase-(share||0)-delivery-gift};
}

/* ---------- parsing ---------- */
var PHONE_RE=/(^|\D)(?:\+?964)?0?(7\d{9})(?!\d)/;
function squeeze(s){return s.replace(/(\d)[ \-](?=\d)/g,'$1')}
function findPhone(s){var m=squeeze(s).match(PHONE_RE);return m?'0'+m[2]:''}
var QTY_RE=/(?:\u0639\u062F\u062F\s*\u0627\u0644\u0642\u0637\u0639|\u0627\u0644\u0639\u062F\u062F|\u0639\u062F\u062F|\u0627\u0644\u0643\u0645\u064A[\u0629\u0647])\s*[:\uFF1A\/\-]?\s*(\d+)/;
var PRICE_RE=/(?:\u0627\u0644\u0633\u0639\u0631|\u0633\u0639\u0631)\s*[:\uFF1A\/\-]?\s*(\d[\d.,\u066C]*)/;
var REP_RE=/\u0645\u0646\u062F\u0648\u0628[\u0629\u0647]?\s*[:\uFF1A\-]?\s*\(?\s*([^\n)]+?)\s*\)?\s*$/;
var ADDR_RE=/^(?:\u0627\u0644)?\u0639\u0646\u0648\u0627\u0646\s*[:\uFF1A\/\-]?\s*(.*)$/;
var MARK_RE=/(?:\u0645\u0646\u062A\u062C|\u0627\u0644\u0645\u0646\u062A\u062C|\u0643\u0648\u062F|\u0631\u0642\u0645|#)\s*[:\uFF1A\-]?\s*(\d{1,3})(?!\d)/g;
var STOP=/(\u0627\u0644\u0644\u0647\u0645|\u062A\u0645 \u0627\u0644\u062D\u062C\u0632|\u062D\u062C\u0632|\u0628\u064A\u062C|\u0627\u0644\u062B\u0627\u0646\u064A|\u0627\u0644\u0627\u0648\u0644|\u0627\u0644\u0627\u0633\u062A\u0644\u0627\u0645|\u0627\u0633\u062A\u0644\u0627\u0645|\u062A\u0648\u0635\u064A\u0644|\u062A\u063A\u0644\u064A\u0641|\u0633\u0631\u064A\u0647|\u0647\u0627\u062A\u0641|\u0631\u0642\u0645|\u0637\u0644\u0628|\u0645\u0646\u062A\u062C|\u0643\u0628\u0633\u0648\u0644|\u0645\u0643\u0628\u0631|\u0627\u0631\u062F\u0627\u0641|\u0633\u0639\u0631|\u0639\u062F\u062F|\u0643\u0645\u064A\u0647|\u0639\u0646\u0648\u0627\u0646|\u0645\u0646\u062F\u0648\u0628)/;
var REP_FILLER=/^(?:(?:\u0627\u0633\u0645|\u0627\u0644\u0645\u0648\u0638\u0641[\u0629\u0647]|\u0627\u0644\u0645\u0648\u0636\u0641[\u0629\u0647])\s+)+/;
var WA_HEADER_LINE_RE=/^[ \t]*\[[^\]\n]{4,40}\][ \t]*[^:\n]{1,40}:[ \t]*/;
function isGreeting(b){return b.split('\n').filter(Boolean).length<=2&&/^\u0627\u0644\u0644\u0647\u0645/.test(norm(b))}

function splitMessages(raw){
  var text=digits(raw);
  var lines=text.split('\n');
  var hasHeaders=lines.some(function(l){return WA_HEADER_LINE_RE.test(l)});
  if(hasHeaders){
    /* real WhatsApp export: each "[date, time] sender:" line starts a NEW message.
       everything after it (including blank lines some phones insert between fields)
       belongs to that same message, until the next such header line appears. */
    var groups=[],cur=null;
    lines.forEach(function(l){
      if(WA_HEADER_LINE_RE.test(l)){
        if(cur!==null)groups.push(cur.join('\n').trim());
        cur=[l.replace(WA_HEADER_LINE_RE,'')];
      }else if(cur!==null){
        cur.push(l);
      }
    });
    if(cur!==null)groups.push(cur.join('\n').trim());
    return groups.filter(function(g){return g&&!(!findPhone(g)&&isGreeting(g))});
  }
  /* no WhatsApp headers in this paste (manually typed/copied) -> group by blank lines + phone marker */
  var blocks=text.split(/\n[ \t]*\n/).map(function(b){return b.trim()}).filter(Boolean);
  var groups2=[],pending=[];
  blocks.forEach(function(b){
    var ph=!!findPhone(b);
    if(!ph&&isGreeting(b))return;
    if(ph){groups2.push(pending.concat([b]));pending=[]}
    else if(groups2.length){groups2[groups2.length-1].push(b)}
    else pending.push(b);
  });
  if(!groups2.length&&pending.length)groups2.push(pending);
  return groups2.map(function(g){return g.join('\n')});
}

function parseMessage(text){
  var lines=digits(text).split('\n').map(function(l){return l.trim()}).filter(Boolean);
  var used={};
  var d={phone:'',address:'',productId:'',qty:1,price:null,rep:'',share:null,shareManual:false,skip:false,dup:false};
  lines.forEach(function(l,i){
    if(!d.phone){var p=findPhone(l);if(p){d.phone=p;used[i]=1}}
  });
  lines.forEach(function(l,i){
    var m=l.match(QTY_RE);if(m){d.qty=Math.max(1,parseInt(m[1],10)||1);used[i]=1}
    m=l.match(PRICE_RE);if(m&&d.price==null){var pr=toPrice(m[1]);if(pr){d.price=pr;used[i]=1}}
    m=l.match(REP_RE);if(m&&m[1]&&!d.rep){var rn=m[1].replace(/[^\p{L}\s]/gu,'').trim().replace(REP_FILLER,'').trim();if(rn){d.rep=rn;used[i]=1}}
    m=l.match(ADDR_RE);if(m&&m[1]&&!d.address){d.address=m[1].trim();used[i]=1}
  });
  if(d.price==null){
    lines.forEach(function(l,i){
      if(d.price==null&&!used[i]&&/^\d[\d.,]*$/.test(l)){
        var pr=toPrice(l);
        if(pr&&pr>=15000){d.price=pr;used[i]=1}
      }
    });
  }
  /* product by name, then by number marker */
  var nt=norm(text),best=null,bestScore=0,bestName='';
  state.products.forEach(function(p){
    [p.name].concat(String(p.alias||'').split(/[,\u060C]/)).map(norm).filter(Boolean).forEach(function(np){
      var sc=0;
      if(np.split(' ').every(function(w){return nt.indexOf(w)>=0}))sc=np.length+(nt.indexOf(np)>=0?5:0);
      if(sc>bestScore){bestScore=sc;best=p;bestName=np}
    });
  });
  if(!best){
    var t=digits(text),mm;
    MARK_RE.lastIndex=0;
    while((mm=MARK_RE.exec(t))){
      var found=state.products.filter(function(p){return String(p.num)===String(parseInt(mm[1],10))||String(p.num)===mm[1]})[0];
      if(found){best=found;break}
    }
  }
  if(best){
    d.productId=best.id;
    lines.forEach(function(l,i){var nl=norm(l);if(bestName&&nl.indexOf(bestName)>=0)used[i]=1});
  }else if(state.products.length===1){d.productId=state.products[0].id}
  /* address + rep fallbacks */
  var cands=[];
  lines.forEach(function(l,i){
    if(used[i]||/\d/.test(l)||!/\p{L}/u.test(l)||STOP.test(norm(l)))return;
    cands.push(i);
  });
  if(!d.address&&cands.length){d.address=lines[cands.shift()]}
  if(!d.rep){
    for(var k=cands.length-1;k>=0;k--){
      var ln=lines[cands[k]].replace(/[^\p{L}\s]/gu,'').trim().replace(REP_FILLER,'').trim();
      if(ln&&ln.split(/\s+/).length<=2){d.rep=ln;break}
    }
  }
  return d;
}

function periodRange(){
  var now=new Date(),t=ymd(now);
  if(period==='today')return[t,t];
  if(period==='yesterday'){var y=new Date(now);y.setDate(y.getDate()-1);return[ymd(y),ymd(y)]}
  if(period==='week'){var w=new Date(now);w.setDate(w.getDate()-((w.getDay()+1)%7));return[ymd(w),t]}
  if(period==='month')return[t.slice(0,7)+'-01',t];
  if(period==='lastmonth'){
    var a=new Date(now.getFullYear(),now.getMonth()-1,1),b=new Date(now.getFullYear(),now.getMonth(),0);
    return[ymd(a),ymd(b)];
  }
  if(period==='year')return[t.slice(0,4)+'-01-01',t];
  if(period==='custom'){
    var f=cFrom||'0000-01-01',e=cTo||'9999-12-31';
    return f<=e?[f,e]:[e,f];
  }
  return null;
}
function inPeriod(date){var r=periodRange();return!r||(date>=r[0]&&date<=r[1])}
function fmtFull(s){return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)}
function periodLabel(){
  var r=periodRange();
  if(!r)return 'كل الفترات';
  if(period==='custom'){
    if(!cFrom&&!cTo)return 'اختر التاريخ';
    return (cFrom?'من '+fmtFull(r[0]):'')+(cFrom&&cTo?' ':'')+(cTo?'إلى '+fmtFull(r[1]):'');
  }
  return r[0]===r[1]?fmtFull(r[0]):'من '+fmtFull(r[0])+' إلى '+fmtFull(r[1]);
}

var pasteArea,dateInput,noProd,draftsBox,summaryEl=null;
function buildPaste(){
  pasteArea=h('textarea',{rows:8,placeholder:'الصق هنا رسالة واحدة أو عدة رسائل من المجموعة'});
  dateInput=h('input',{type:'date',value:todayStr()});

    noProd,

      h('label',{class:'field'},h('span',null,'الرسائل'),pasteArea),
      h('label',{class:'field'},h('span',null,'تاريخ الطلبات'),dateInput),
      h('button',{class:'btn',onclick:readMessages},'اقرأ الرسائل')
    ),
    draftsBox
  );
}
function refreshPasteNotice(){
  noProd.replaceChildren();
  if(!state.products.length){
    noProd.appendChild(h('div',{class:'flag warn'},
      'لا توجد منتجات بعد. أضف منتجاتك من تبويب المنتجات حتى يتعرف عليها النظام. ',
      h('button',{class:'btn small ghost',onclick:function(){setTab('products')}},'إضافة منتج')));
  }
  fillReps();
}
function readMessages(){
  var raw=pasteArea.value.trim();
  if(!raw){toast('الصق الرسائل أولاً');return}
  batchDate=dateInput.value||todayStr();
  drafts=splitMessages(raw).map(parseMessage);
  var known=repNames();
  drafts.forEach(function(d){
    d.companyId=state.settings.defaultCompany;
    var k=norm(d.rep);
    for(var i=0;i<known.length;i++){if(known[i].key===k){d.rep=known[i].name;break}}
  });
  var seen={},all=allOrders();
  drafts.forEach(function(d){
    if(!d.phone)return;
    var same=all.some(function(o){return o.phone===d.phone&&o.date===batchDate});
    if(same||seen[d.phone]){d.dup=true;d.skip=true}
    else{
      var prev=all.filter(function(o){return o.phone===d.phone&&o.date<batchDate&&daysBetween(o.date,batchDate)<=7})
        .sort(function(a,b){return b.date.localeCompare(a.date)})[0];
      if(prev)d.recent=prev.date;
    }
    seen[d.phone]=1;
  });
  fillReps();renderDrafts();
  if(!drafts.length)toast('لم أجد رقم هاتف في الرسائل');
}
function calcNet(d){return calc(d.price,d.qty,d.share,companyById(d.companyId).fee).net}
function updateSummary(){
  if(!summaryEl)return;
  var act=drafts.filter(function(d){return!d.skip}),ready=0,review=0,total=0;
  act.forEach(function(d){if(validate(d).length)review++;else{ready++;total+=calcNet(d)}});
  var skipped=drafts.length-act.length;
  summaryEl.replaceChildren(
    h('span',{class:'chip'},'وجدت '+drafts.length+(drafts.length===1?' طلباً':' طلبات')),
    ready?h('span',{class:'chip'},ready+' جاهز \u00B7 ربح متوقع '+fmt(total)):null,
    review?h('span',{class:'chip warn'},review+' يحتاج مراجعة'):null,
    skipped?h('span',{class:'chip bad'},skipped+' متجاهَل'):null);
}
function updateSaveBtn(){
  updateSummary();
  if(!saveBtn)return;
  var n=drafts.filter(function(d){return!d.skip}).length;
  saveBtn.textContent='احفظ الطلبات ('+n+')';
  saveBtn.disabled=n===0;
}
function renderDrafts(){
  draftsBox.replaceChildren();saveBtn=null;summaryEl=null;
  if(!drafts.length)return;
  summaryEl=h('div',{class:'summary'});
  draftsBox.appendChild(summaryEl);
  drafts.forEach(function(d,i){draftsBox.appendChild(buildCard(d,i))});
  saveBtn=h('button',{class:'btn',onclick:saveDrafts},'');
  draftsBox.appendChild(h('div',{class:'savebar'},saveBtn));
  updateSaveBtn();
}
function validate(d){
  var e=[];
  if(d.price==null)e.push('price');
  if(!d.rep.trim())e.push('rep');
  if(!d.productId)e.push('product');
  if(d.share==null)e.push('share');
  return e;
}
function saveDrafts(){
  var saved=0,blocked=0;
  drafts.forEach(function(d){
    if(d.skip||d.saved)return;
    if(validate(d).length){blocked++;return}
    var prod=state.products.filter(function(p){return p.id===d.productId})[0];
    var comp=companyById(d.companyId),c=calc(d.price,d.qty,d.share,comp.fee);
    (state.days[batchDate]=state.days[batchDate]||[]).push({id:uid(),date:batchDate,phone:d.phone,address:d.address,
      productId:prod.id,productName:prod.name,productNum:prod.num,qty:d.qty,price:d.price,
      rep:d.rep.trim(),share:d.share,companyId:comp.id,companyName:comp.name,purchase:c.purchase,delivery:c.delivery,gift:c.gift,net:c.net,createdAt:Date.now()});
    d.saved=true;saved++;
  });
  if(saved)saveDay(batchDate);
  drafts=drafts.filter(function(d){return!d.saved});
  fillReps();renderDrafts();
  if(!drafts.length)pasteArea.value='';
  if(saved){celebrate(saved);if(blocked)toast('بقي '+blocked+' طلب يحتاج إلى استكمال')}
  else if(blocked)toast('أكمل الحقول الناقصة أولاً');
}
function prodList(opts){
  var l=state.products.slice();
  if(opts&&opts.extraProduct&&!l.some(function(p){return p.id===opts.extraProduct.id}))l.push(opts.extraProduct);
  return l;
}
function buildCard(d,idx,opts){
  opts=opts||{};
  var badge=h('span',{class:'badge ok'},'جاهز');
  var card=h('section',{class:'card draft'+(d.skip?' skipped':'')});
  var flags=h('div'),slip=h('div',{class:'slip'});
  var phone=h('input',{type:'tel',inputmode:'tel',value:d.phone,placeholder:'07XXXXXXXXX'});
  var addr=h('input',{type:'text',value:d.address,placeholder:'العنوان'});
  var prod=h('select',{value:d.productId},
    h('option',{value:''},'\u2014 اختر المنتج \u2014'),
    prodList(opts).map(function(p){return h('option',{value:p.id},p.num+' \u00B7 '+p.name)}));
  var comp=h('select',{value:d.companyId},state.settings.companies.map(function(c){return h('option',{value:c.id},c.name+' ('+fmt(c.fee)+')')}));
  var qty=h('input',{type:'number',min:'1',inputmode:'numeric',value:d.qty});
  var price=h('input',{type:'number',inputmode:'numeric',value:d.price==null?'':d.price});
  var rep=h('input',{type:'text',list:'reps',value:d.rep,placeholder:'اسم المندوبة'});
  var share=h('input',{type:'number',inputmode:'numeric',value:(d.shareManual&&d.share!=null)?d.share:''});
  var shareNote=h('span',{class:'small-text muted'});

  function refresh(){
    var sf=shareFor(d.price,d.qty);
    if(!d.shareManual){d.share=sf.share;share.value=sf.share==null?'':sf.share}
    shareNote.textContent=d.shareManual?'(يدوي، امسحه للعودة إلى التلقائي)':(sf.share==null?'':'(تلقائي)');
    flags.replaceChildren();
    function flag(t,c){flags.appendChild(h('div',{class:'flag '+c},t))}
    if(d.dup)flag('هذا الرقم مسجل في نفس اليوم، لذلك أُلغي تحديد الطلب.','warn');
    if(!d.phone)flag('لم أجد رقم الهاتف.','warn');
    else if(!/^07\d{9}$/.test(d.phone))flag('رقم الهاتف غير مكتمل: يجب أن يكون 11 رقماً ويبدأ بـ07.','warn');
    if(d.recent)flag('هذا الرقم لديه طلب سابق بتاريخ '+fmtFull(d.recent)+'. تأكد أنه ليس مكرراً.','warn');
    if(d.price==null)flag('لم أجد السعر. اكتبه بيدك.','err');
    else if(sf.warn&&(!d.shareManual||sf.kind==='min'))flag(sf.warn,'warn');
    if(d.price!=null&&d.price>200000)flag('السعر يبدو كبيراً، تأكد منه.','warn');
    if(d.qty>10)flag('عدد القطع كبير، تأكد منه.','warn');
    if(!d.productId)flag('اختر المنتج.','err');
    if(!d.rep.trim())flag('اكتب اسم المندوبة.','err');
    var ok=d.price!=null;
    var cmp=companyById(d.companyId),c=ok?calc(d.price,d.qty,d.share,cmp.fee):null;
    var net=(ok&&d.share!=null)?c.net:null;
    slip.replaceChildren(
      slipRow('سعر البيع',ok?d.price:null,''),
      slipRow('سعر الشراء ('+d.qty+' قطعة)',ok?c.purchase:null,'\u2212'),
      slipRow('حصة المندوبة',d.share,'\u2212'),
      slipRow(cmp.name,ok?c.delivery:null,'\u2212'),
      slipRow('الهدايا',ok?c.gift:null,'\u2212'),
      h('div',{class:'net'},h('span',null,'صافي الربح'),
        h('strong',{class:net!=null&&net<0?'neg':''},h('span',{class:'num'},fmt(net))))
    );
    var needs=validate(d).length>0;
    badge.textContent=needs?'يحتاج مراجعة':'جاهز';
    badge.className='badge '+(needs?'review':'ok');
    card.classList.toggle('review',needs);card.classList.toggle('ready',!needs);
    updateSaveBtn();
  }
  function slipRow(label,val,sign){
    return h('div',{class:'row'},h('span',null,label),h('b',null,val==null?'\u2014':num(val,sign)));
  }
  phone.addEventListener('input',function(){d.phone=phone.value.trim();refresh()});
  addr.addEventListener('input',function(){d.address=addr.value});
  prod.addEventListener('change',function(){d.productId=prod.value;refresh()});
  comp.addEventListener('change',function(){d.companyId=comp.value;refresh()});
  qty.addEventListener('input',function(){d.qty=Math.max(1,parseInt(qty.value,10)||1);refresh()});
  price.addEventListener('input',function(){d.price=price.value===''?null:toPrice(price.value);refresh()});
  rep.addEventListener('input',function(){d.rep=rep.value;refresh()});
  share.addEventListener('input',function(){
    if(share.value===''){d.shareManual=false}
    else{d.shareManual=true;d.share=Math.round(+share.value)}
    refresh();
  });
  var skip=h('input',{type:'checkbox',checked:d.skip});
  skip.addEventListener('change',function(){d.skip=skip.checked;card.classList.toggle('skipped',d.skip);updateSaveBtn()});

  card.append(
    opts.edit?h('div',{class:'dhead'},h('b',null,'بيانات الطلب')):h('div',{class:'dhead'},h('span',null,h('b',null,'الطلب '+(idx+1)),badge),h('label',null,skip,'تجاهل')),
    h('label',{class:'field'},h('span',null,'رقم الهاتف'),phone),
    h('label',{class:'field'},h('span',null,'العنوان'),addr),
    h('label',{class:'field'},h('span',null,'المنتج'),prod),
    h('div',{class:'grid2'},
      h('label',{class:'field'},h('span',null,'عدد القطع'),qty),
      h('label',{class:'field'},h('span',null,'سعر البيع (دينار)'),price)),
    h('label',{class:'field'},h('span',null,'شركة التوصيل'),comp),
    h('label',{class:'field'},h('span',null,'المندوبة'),rep),
    h('label',{class:'field'},h('span',null,'حصة المندوبة ',shareNote),share),
    flags,slip
  );
  refresh();
  return card;
}

function filterBar(cb,withRep){
  var wrap=h('div');

    h('option',{value:'today'},'اليوم'),h('option',{value:'yesterday'},'أمس'),
    h('option',{value:'week'},'هذا الأسبوع'),h('option',{value:'month'},'هذا الشهر'),

    h('option',{value:'custom'},'من تاريخ إلى تاريخ'),h('option',{value:'all'},'كل الفترات'));

  wrap.appendChild(h('p',{class:'hint'},periodLabel()));
  return wrap;

var MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
function weekStart(ds){
  var w=new Date(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10));
  w.setDate(w.getDate()-((w.getDay()+1)%7));
  return ymd(w);
}
function grainKey(ds){return grain==='month'?ds.slice(0,7):(grain==='week'?weekStart(ds):ds)}
function grainLabel(k){
  if(grain==='month')return MONTHS[+k.slice(5,7)-1]+' '+k.slice(0,4);
  if(grain==='week')return 'أسبوع '+fmtDate(k);
  return fmtDate(k);
}
function moneyRow(label,val,sign){return h('div',{class:'row'},h('span',null,label),h('b',null,val==null?'\u2014':num(val,sign)))}
function kvRow(label,val){return h('div',null,h('span',null,label),h('b',null,num(val)))}
function totalsOf(list){
  var t={n:list.length,pieces:0,sales:0,purchase:0,share:0,delivery:0,gift:0,net:0};
  list.forEach(function(o){
    t.pieces+=o.qty||0;t.sales+=o.price||0;t.purchase+=o.purchase||0;
    t.share+=o.share||0;t.delivery+=o.delivery||0;t.gift+=o.gift||0;t.net+=o.net||0;
  });
  return t;
}
function group(list,keyFn){
  var m={},order=[];
  list.forEach(function(o){var k=keyFn(o);if(!m[k]){m[k]=[];order.push(k)}m[k].push(o)});
  return{map:m,keys:order};
}
function miniTable(head,rows){

    h('thead',null,h('tr',null,head.map(function(x){return h('th',null,x)}))),
    h('tbody',null,rows.map(function(r){return h('tr',null,r.map(function(c,i){return h('td',null,i===0?c:num(c))}))}))));
}

try{document.getElementById('today').textContent=new Date().toLocaleDateString('ar-IQ-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})}catch(e){}
var remoteConfig=null,remoteDays=null,gotConfig=false,gotDays=false,synced=false;
function rerender(pc){
  if(tab==='home')renderHome();
  else if(tab==='orders')renderOrders();
  else if(tab==='reports')renderReports();
  else if(tab==='products')renderProducts();
  else if(tab==='settings')renderSettings();
  else if(tab==='paste'){refreshPasteNotice();if(pc&&drafts.length)renderDrafts()}
}
function applyRemote(){
  if(!synced||isBusy())return;
  var changed=false,pc=false;
  if(remoteConfig){
    var d=defaults();
    applySettings(d,clone(remoteConfig.settings||{}));
    var np=Array.isArray(remoteConfig.products)?clone(remoteConfig.products):[];
    if(canon(np)!==canon(state.products)){state.products=np;changed=true;pc=true}
    if(canon(d.settings)!==canon(state.settings)){state.settings=d.settings;changed=true}
  }
  if(remoteDays&&canon(remoteDays)!==canon(state.days)){state.days=clone(remoteDays);changed=true}
  if(changed){fillReps();rerender(pc)}
}
function trySync(force){
  if(synced)return;
  if(!force&&!(gotConfig&&gotDays))return;
  synced=true;
  var emptyRemote=!remoteConfig&&!Object.keys(remoteDays||{}).length;
  if(!force&&emptyRemote&&(state.products.length||Object.keys(state.days).length)){saveAll();return}
  applyRemote();
}
function dbFailed(e){
  lastDbError=(e&&e.code)||'';
  dbStatus='local';showBanner();
}
var auth=null,fs=null,unsubs=[],syncTimer=null;
function startDb(){
  db=fs;dbStatus='ok';
  synced=false;gotConfig=false;gotDays=false;remoteConfig=null;remoteDays=null;lastDbError='';
  unsubs=[
    fs.doc('app/config').onSnapshot(function(snap){
      remoteConfig=snap.exists?snap.data():null;
      if(!snap.metadata.fromCache)gotConfig=true;
      if(synced)applyRemote();else trySync(false);
    },dbFailed),
    fs.collection('days').onSnapshot(function(snap){
      var m={};
      snap.docs.forEach(function(x){var b=x.data()||{};if(Array.isArray(b.orders)&&b.orders.length)m[x.id]=b.orders});
      remoteDays=m;
      if(!snap.metadata.fromCache)gotDays=true;
      if(synced)applyRemote();else trySync(false);
    },dbFailed)
  ];
  showBanner();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){if(!synced&&dbStatus==='ok')trySync(true)},5000);
}
function stopDb(){
  unsubs.forEach(function(u){try{u()}catch(e){}});
  unsubs=[];db=null;dbStatus='connecting';
  clearTimeout(syncTimer);pend={};busyKeys={};
}
var BIO_KEY='sr_bio';
function bioData(){
  try{var b=JSON.parse(localStorage.getItem(BIO_KEY)||'null');return(b&&currentUser&&b.uid===currentUser.uid)?b:null}
  catch(e){return null}
}
function bioEnabled(){return!!bioData()}
function bioSupported(){return!!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create&&window.isSecureContext!==false)}
function toB64u(buf){var b=new Uint8Array(buf),t='';for(var i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function fromB64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var bin=atob(t),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a}
function bioRegister(){
  if(!bioSupported()||!currentUser)return Promise.reject({name:'Unsupported'});
  var mail=currentUser.email||'user';
  return navigator.credentials.create({publicKey:{
    challenge:rnd(32),rp:{name:'مبيعات المندوبات'},
    user:{id:new TextEncoder().encode(currentUser.uid),name:mail,displayName:mail},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
    timeout:60000,attestation:'none'}}).then(function(cred){
      localStorage.setItem(BIO_KEY,JSON.stringify({uid:currentUser.uid,id:toB64u(cred.rawId),at:Date.now()}));
    });
}
function bioVerify(){
  var b=bioData();
  if(!b)return Promise.reject({name:'NoCredential'});
  return navigator.credentials.get({publicKey:{challenge:rnd(32),
    allowCredentials:[{type:'public-key',id:fromB64u(b.id),transports:['internal']}],userVerification:'required',timeout:60000}});
}
function bioErr(e){
  var n=(e&&e.name)||'';
  if(n==='NotAllowedError')return 'أُلغي التحقق أو لم يُسمح به';
  if(n==='SecurityError')return 'المتصفح لا يسمح بهذه الميزة في هذه الصفحة';
  return 'تعذر التفعيل ('+n+')';
}
function bioCard(){
  var status=h('p',{class:'hint'},''),btn=h('button',{class:'btn'},'');
  function paint(){
    if(!bioSupported()){
      status.textContent='هذا الجهاز أو هذه الصفحة لا يدعم الدخول بالوجه أو البصمة. جرّب فتح البرنامج من عنوانه الخاص (رابط https) وليس داخل محرر الكود.';
      btn.hidden=true;return;
    }
    btn.hidden=false;
    if(bioEnabled()){status.textContent='مفعّل على هذا الجهاز. يُقفل البرنامج إذا ابتعدت عنه دقيقتين.';btn.textContent='إيقاف القفل';btn.className='btn danger'}
    else{status.textContent='فعّله ليطلب البرنامج وجهك أو بصمتك عند فتحه.';btn.textContent='تفعيل الدخول بالوجه أو البصمة';btn.className='btn'}
  }
  btn.addEventListener('click',function(){
    if(bioEnabled()){try{localStorage.removeItem(BIO_KEY)}catch(e){}paint();toast('تم إيقاف القفل');return}
    btn.disabled=true;
    bioRegister().then(function(){toast('تم التفعيل');paint()}).catch(function(e){toast(bioErr(e))}).then(function(){btn.disabled=false});
  });
  paint();
  return h('div',{class:'card'},h('h2',null,'الدخول بالوجه أو البصمة'),status,btn);
}
function lockApp(){
  var el=document.getElementById('lock');if(!el)return;
  document.getElementById('lockMsg').textContent='استخدم الوجه أو البصمة للمتابعة';
  el.hidden=false;
}
function unlockApp(){var el=document.getElementById('lock');if(el)el.hidden=true}
function bindLock(){
  document.getElementById('unlockBtn').addEventListener('click',function(){
    bioVerify().then(unlockApp).catch(function(){
      document.getElementById('lockMsg').textContent='لم يتم التحقق. حاول مرة أخرى أو ادخل بكلمة السر.';
    });
  });
  document.getElementById('lockPass').addEventListener('click',function(){unlockApp();if(auth)auth.signOut()});
  var hiddenAt=0;
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){hiddenAt=Date.now();return}
    if(hiddenAt&&currentUser&&bioEnabled()&&Date.now()-hiddenAt>120000)lockApp();
    hiddenAt=0;
  });
}
function initTheme(){
  try{var t=localStorage.getItem('sr_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
  document.getElementById('themeBtn').addEventListener('click',function(){
    var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    var cur=document.documentElement.getAttribute('data-theme')||(dark?'dark':'light');
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('sr_theme',next)}catch(e){}
  });
}
function gateShow(msg){
  document.getElementById('gateMsg').textContent=msg;
  document.getElementById('gateMsg').hidden=false;
  document.getElementById('gateForm').hidden=true;
}
function onSignedIn(user){
  currentUser=user;
  document.getElementById('gate').hidden=true;
  document.getElementById('appRoot').hidden=false;
  document.getElementById('tabs').hidden=false;
  startDb();
  setTab(tab);
  var needLock=bioEnabled()&&!manualLogin;
  manualLogin=false;
  if(needLock)lockApp();
}
function onSignedOut(){
  stopDb();currentUser=null;unlockApp();
  state=defaults();drafts=[];
  if(pasteArea)pasteArea.value='';
  renderDrafts();
  document.getElementById('appRoot').hidden=true;
  document.getElementById('tabs').hidden=true;
  document.getElementById('gate').hidden=false;
  document.getElementById('gateMsg').hidden=true;
  document.getElementById('gateForm').hidden=false;
  document.getElementById('loginPass').value='';
  showBanner();
}
function authMsg(e){
  var c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return 'الإيميل أو كلمة السر غير صحيحة';
  if(c==='auth/invalid-email')return 'صيغة الإيميل غير صحيحة';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة. انتظر قليلاً ثم حاول مرة أخرى';
  if(c==='auth/network-request-failed')return 'لا يوجد اتصال بالإنترنت';
  if(c==='auth/unauthorized-domain')return 'هذا الموقع غير مصرّح له في Firebase. أضفه من Authentication ثم Settings ثم Authorized domains';
  return 'تعذر تسجيل الدخول ('+c+')';
}
function bindGate(){
  var form=document.getElementById('loginForm'),em=document.getElementById('loginEmail'),pw=document.getElementById('loginPass');
  var err=document.getElementById('loginErr'),ok=document.getElementById('loginOk'),btn=document.getElementById('loginBtn'),reset=document.getElementById('resetBtn');
  function showErr(t){ok.hidden=true;err.textContent=t;err.hidden=false}
  function showOk(t){err.hidden=true;ok.textContent=t;ok.hidden=false}
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var e1=em.value.trim(),p1=pw.value;
    if(!auth){showErr('Firebase لم يُحمَّل بعد. حدّث الصفحة.');return}
    if(!e1||!p1){showErr('اكتب الإيميل وكلمة السر');return}
    btn.disabled=true;btn.textContent='جارٍ الدخول…';err.hidden=true;ok.hidden=true;
    manualLogin=true;
    auth.signInWithEmailAndPassword(e1,p1).catch(function(e){manualLogin=false;showErr(authMsg(e))}).then(function(){btn.disabled=false;btn.textContent='تسجيل الدخول'});
  });
  reset.addEventListener('click',function(){
    var e1=em.value.trim();
    if(!auth)return;
    if(!e1){showErr('اكتب إيميلك أولاً ثم اضغط نسيت كلمة السر');return}
    auth.sendPasswordResetEmail(e1).then(function(){showOk('أرسلنا رابط تغيير كلمة السر إلى إيميلك')}).catch(function(e){showErr(authMsg(e))});
  });
}
function setupFirebase(){
  if(typeof firebase==='undefined'){gateShow('تعذر تحميل Firebase. تحقق من الإنترنت ثم حدّث الصفحة.');return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth();fs=firebase.firestore();
    try{fs.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    auth.onAuthStateChanged(function(user){if(user)onSignedIn(user);else onSignedOut()});
  }catch(e){gateShow('حدث خطأ في تهيئة Firebase: '+((e&&e.code)||''))}
}
showBanner();
buildPaste();
setTab('home');
initTheme();
bindLock();
bindGate();
setupFirebase();
})();
</script>
</body>
</html>
